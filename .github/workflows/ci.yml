name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas numpy pytest ruff
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts/pruning/generate_compact_accounting_plans.py scripts/steering
      - name: Unit tests
        run: pytest
      - name: Public-tree audit
        run: python scripts/validation/audit_public_tree.py --root .
