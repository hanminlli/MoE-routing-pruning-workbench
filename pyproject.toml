[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "routecat-moe-steering"
version = "0.1.0"
description = "A two-phase pipeline for MoE expert pruning and activation steering."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "torch>=2.8,<3",
  "transformers>=4.51,<5",
  "accelerate>=1.4,<2",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.28,<2",
  "pyyaml>=6.0,<7",
  "tqdm>=4.66,<5",
]


[project.optional-dependencies]
agent = [
  "stirrup>=0.1.12",
  "openai>=1.65,<2",
  "datasets>=3.2,<5",
  "jsonlines>=4.0,<5",
  "jinja2>=3.1,<4",
]

dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9",
  "build>=1.2,<2",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["routecat_moe_steering*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"